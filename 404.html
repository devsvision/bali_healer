<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Bali Healer</title>
    <meta name="description" content="The Bali Healer page you are looking for could not be found. Return home or browse healing services in Bali." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://balihealer.com/404.html" />
    <link rel="icon" type="image/png" href="./assets/images/logo-bali-healer.png" />
    <link rel="apple-touch-icon" href="./assets/images/logo-bali-healer.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preload" href="./assets/images/logo-bali-healer.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bali Healer" />
    <meta property="og:title" content="Page Not Found | Bali Healer" />
    <meta property="og:description" content="Return to Bali Healer and continue exploring trusted healing services in Bali." />
    <meta property="og:url" content="https://balihealer.com/404.html" />
    <meta property="og:image" content="https://balihealer.com/assets/images/logo-bali-healer.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              night: "#050505",
              charcoal: "#111111",
              panel: "#181512",
              gold: "#d6aa43",
              goldSoft: "#f4d987",
              bronze: "#8c6827",
              mist: "#f8f1df"
            },
            fontFamily: {
              cinzel: ["Cinzel", "serif"]
            },
            boxShadow: {
              gold: "0 20px 70px rgba(214, 170, 67, 0.18)"
            }
          }
        }
      };
    </script>
    <style>
      * {
        scrollbar-color: rgba(214, 170, 67, 0.8) rgba(214, 170, 67, 0.12);
      }

      body {
        background:
          radial-gradient(circle at 50% 18%, rgba(214, 170, 67, 0.2), transparent 34rem),
          linear-gradient(rgba(214, 170, 67, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(214, 170, 67, 0.045) 1px, transparent 1px),
          #050505;
        background-size: auto, 72px 72px, 72px 72px, auto;
      }
    </style>
  </head>
  <body class="min-h-screen bg-night text-mist antialiased">
    <header class="relative z-10 border-b border-gold/15 bg-black/70 px-4 py-4 backdrop-blur lg:px-8">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-4">
        <a href="./" class="flex items-center gap-3" aria-label="Bali Healer home">
          <img src="./assets/images/logo-bali-healer.png" alt="BALI HEALER logo" class="h-12 w-12 rounded-full bg-black object-contain ring-1 ring-gold/70" />
          <span class="font-cinzel text-lg font-extrabold uppercase tracking-normal text-gold">BALI HEALER</span>
        </a>
        <nav class="hidden items-center gap-7 md:flex" aria-label="Primary navigation">
          <a href="./#home" class="text-sm font-medium text-mist/70 transition hover:text-goldSoft">Home</a>
          <a href="./#healers" class="text-sm font-medium text-mist/70 transition hover:text-goldSoft">Healers</a>
          <a href="./#services" class="text-sm font-medium text-mist/70 transition hover:text-goldSoft">Services</a>
          <a href="./#about" class="text-sm font-medium text-mist/70 transition hover:text-goldSoft">About</a>
        </nav>
      </div>
    </header>

    <main class="relative z-10 flex min-h-[calc(100vh-82px)] items-center px-4 py-16 lg:px-8">
      <section class="mx-auto grid w-full max-w-6xl items-center gap-12 lg:grid-cols-[0.95fr_1.05fr]">
        <div class="order-2 lg:order-1">
          <div class="inline-flex items-center gap-3 border border-gold/25 bg-black/45 px-4 py-2 text-xs font-bold uppercase tracking-[0.22em] text-goldSoft">
            Error 404
          </div>
          <h1 class="font-cinzel mt-8 max-w-3xl text-4xl font-black uppercase leading-tight tracking-normal text-gold md:text-6xl">
            Page Not Found
          </h1>
          <p class="mt-6 max-w-2xl text-base leading-8 text-mist/68 md:text-lg">
            The page may have moved, the address may be mistyped, or the healing path may have taken another turn.
          </p>
          <div class="mt-9 flex flex-col gap-3 sm:flex-row">
            <a href="./" class="inline-flex h-12 items-center justify-center rounded-lg bg-gold px-6 text-sm font-black uppercase tracking-normal text-black transition hover:bg-goldSoft focus:outline-none focus:ring-2 focus:ring-goldSoft focus:ring-offset-2 focus:ring-offset-night">
              Return Home
            </a>
            <a href="./#services" class="inline-flex h-12 items-center justify-center rounded-lg border border-gold/35 bg-black/40 px-6 text-sm font-bold uppercase tracking-normal text-goldSoft transition hover:border-gold hover:bg-gold/10 focus:outline-none focus:ring-2 focus:ring-goldSoft focus:ring-offset-2 focus:ring-offset-night">
              Browse Services
            </a>
            <button type="button" data-go-back class="inline-flex h-12 items-center justify-center rounded-lg border border-mist/15 bg-mist/5 px-6 text-sm font-bold uppercase tracking-normal text-mist/80 transition hover:border-mist/35 hover:bg-mist/10 focus:outline-none focus:ring-2 focus:ring-goldSoft focus:ring-offset-2 focus:ring-offset-night">
              Go Back
            </button>
          </div>
        </div>

        <div class="order-1 flex justify-center lg:order-2 lg:justify-end" aria-hidden="true">
          <div class="relative flex aspect-square w-full max-w-[24rem] items-center justify-center rounded-full border border-gold/20 bg-black/60 shadow-gold">
            <div class="absolute inset-6 rounded-full border border-gold/15"></div>
            <div class="absolute inset-14 rounded-full border border-gold/10"></div>
            <img src="./assets/images/logo-bali-healer.png" alt="" class="relative h-44 w-44 rounded-full object-contain ring-1 ring-gold/70 md:h-56 md:w-56" />
            <span class="font-cinzel absolute -bottom-2 rounded-lg border border-gold/25 bg-night px-5 py-2 text-5xl font-black text-goldSoft md:text-6xl">404</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const backButton = document.querySelector("[data-go-back]");

      backButton?.addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.location.href = "./";
      });
    </script>
  </body>
</html>
